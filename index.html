<!DOCTYPE html>
<html lang="ja">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202124">
  <title>MO COLLECTIONS SCANNER</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      box-sizing: border-box;
      padding: 24px 16px;
      background: #202124;
      color: #F0EDF1;
      font-family: sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
    }

    h2 {
      font-size: 19px;
      font-family: Montserrat, sans-serif;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .eyebrow {
      color: #D55787;
      font-family: Montserrat, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      margin: 0 0 14px;
    }
    
      .sub-text {
      color: #9ea1a3;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .camera-label {
      color: #777985;
      font-family: Montserrat, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      margin: 12px 0 -12px;
    }

    #reader {
      position: relative;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      margin: 24px auto;
      padding: 0;
      border: none;
      overflow: hidden;
      border-radius: 12px;
    }
    
    #reader video {
      display: block;
      width: 100%;
      border-radius: 12px;
    }

    /* ピンクのスキャンガイド */
    #reader::after {
      content: "";
      position: absolute;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(280px, calc(100% - 32px));
      height: 140px;
      box-sizing: border-box;
      border: 1px solid rgba(213, 87, 135, 0.9);
      border-radius: 5px;
      box-shadow: 0 0 8px rgba(213, 87, 135, 0.18);
      pointer-events: none;
    }
    
    /* html5-qrcodeの白い補助枠を非表示 */
    #qr-shaded-region > div {
      display: none !important;
    }
    
    /* 周囲のブラックオーバーレイを解除 */
    #qr-shaded-region {
      border-color: transparent !important;
    }

    .start-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    
    .btn-start {
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
      padding: 14px 24px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: linear-gradient(
        105deg,
        #485797,
        #8E4D70,
        #D55787
      );
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: Montserrat, sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
    }
    
    .btn-start:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }
    
    .btn-start:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 閉じるボタン（×とテキストの縦並び・枠なし） */
    .btn-close {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 20px;
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: #9ea1a3;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-close .close-icon {
      font-size: 22px;
      line-height: 1;
    }

    .btn-close:hover {
      opacity: 0.75;
    }

    #status {
      color: #D55787;
      font-family: Montserrat, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      margin-top: 8px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <h2>MO COLLECTIONS</h2>

  <p class="eyebrow">BARCODE SCANNER</p>

  <p class="sub-text">
    カメラを起動し、バーコードをカメラにかざしてください
  </p>

  <p class="camera-label">CAMERA VIEW</p>

  <div id="reader"></div>

  <p id="status">● CAMERA READY</p>

  <div class="start-wrap">
    <button id="startButton" class="btn-start"
      onclick="startCamera()">
      カメラを起動
    </button>
  </div>

  <div>
    <button class="btn-close" onclick="window.close()">
      <span class="close-icon">&times;</span>
      <span>閉じる</span>
    </button>
  </div>

  <script>
    let scanner = null;
    let scanHandled = false;

    async function startCamera() {
      if (scanner) return;

      scanHandled = false;
      document.getElementById('status').textContent =
        '● CAMERA STARTING...';

      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8
        ]
      });

      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 280, height: 140 } },
          async (decodedText) => {
            if (scanHandled) return;
            scanHandled = true;

            document.getElementById('status').textContent =
              '読み取り成功：' + decodedText;

            try {
              await scanner.stop();
            } catch (e) {}

            if (window.opener) {
              window.opener.postMessage({
                type: 'JAN_SCANNED',
                code: decodedText
              }, '*');

              window.close();
            } else {
              document.getElementById('status').textContent =
                '元のアプリに接続できませんでした。';
            }
          }
        );

        document.getElementById('startButton').disabled = true;
        document.getElementById('status').textContent =
          '● SCANNING...';

      } catch (err) {
        scanner = null;
        document.getElementById('status').textContent =
          'カメラを起動できませんでした：' + err;
      }
    }
  </script>
</body>
</html>
